<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>wow.games: minijogos de poucos minutos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <!-- 1) Núcleo do site (registro, rotas, utilitários) -->
  <script src="script.js"></script>

  <!-- 1b) Sistemas globais: perfil, XP, conquistas e desafio do dia -->
  <script src="perfil.js"></script>
  <script src="conquistas.js"></script>
  <script src="pontuacao.js"></script>   <!-- pontuação global de todos os jogos -->
  <script src="loja.js"></script>        <!-- loja: títulos, ícones, molduras e cursores -->
  <script src="perfil-recuperacao.js"></script>
  <script src="favoritos.js"></script>     <!-- favoritos da página inicial -->
  <script src="placar-config.js"></script> <!-- configuração PÚBLICA do placar global (Supabase) -->
  <script src="placar.js"></script>        <!-- placar global -->
  <script src="admin.js"></script>         <!-- ferramentas de teste locais (#/admin), sem acesso ao placar -->
  <script src="mundo/mundo-dados.js"></script>      <!-- wow.world: regiões, missões, segredos e mapas -->
  <script src="mundo/mundo-estado.js"></script>     <!-- wow.world: progresso salvo em wowgames.mundo.v1 -->
  <script src="mundo/mundo-integracao.js"></script> <!-- wow.world: ouve os eventos dos jogos -->
  <script src="mundo/mundo-areas.js"></script>      <!-- wow.world: áreas com personagem -->
  <script src="mundo/mundo.js"></script>            <!-- wow.world: página #/mundo -->

  <!-- 2) Jogos: para adicionar um novo, crie games/seujogo.js e inclua uma linha aqui -->
  <script src="games/botao.js"></script>
  <script src="games/tempo.js"></script>
  <script src="games/premios.js"></script>
  <script src="games/matematica.js"></script>
  <script src="games/cor.js"></script>
  <script src="games/sequencia.js"></script>
  <script src="games/investigacao.js"></script>
  <script src="games/milhao.js"></script>
  <script src="games/peso.js"></script>          <!-- jogo 9: Adivinhe o Peso -->
  <script src="games/super-velha.js"></script>   <!-- jogo 10: Super Jogo da Velha -->
  <script src="games/elements.js"></script>      <!-- jogo 11: wow.elements (Laboratório de Elementos) -->
  <script src="games/perguntas-show.js"></script> <!-- banco de perguntas do jogo 12 (precisa vir antes do jogo) -->
  <script src="games/show-perguntas.js"></script> <!-- jogo 12: Show de Perguntas -->
  <script src="games/craques-dados.js"></script>   <!-- jogo 13: Leilão dos Craques — catálogo de atletas e equipes -->
  <script src="games/craques-regras.js"></script>  <!-- jogo 13: regras (mercado, formações, leilão, copa) -->
  <script src="games/craques-partida.js"></script> <!-- jogo 13: motor da partida e campo 2D -->
  <script src="games/craques.js"></script>         <!-- jogo 13: telas e integração -->
  <script src="games/calm-dados.js"></script>      <!-- jogo 14: wow.calm, dados e balanceamento -->
  <script src="games/calm-som.js"></script>        <!-- jogo 14: sons sintetizados (Web Audio) -->
  <script src="games/calm.js"></script>            <!-- jogo 14: tela e integração -->
</body>
</html>
